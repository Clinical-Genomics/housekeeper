name: Build and publish image for branch

on:
  push:
    branches-ignore:
      - 'master'

jobs:
  docker-image-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out git repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create tags
      id: create_tags
      run: |
        BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr "/" "-")
        TAGS="clinicalgenomics/housekeeper:$BRANCH_NAME"
        echo "TAGS=$TAGS" >> $GITHUB_ENV

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: ${{ env.TAGS }}
        # OCI index (provenance attestation) breaks Singularity 3.1.1 on Hasta. This can be removed once we're using
        # newer versions of Apptainer/Singularity that can pull OCI image indexes everywhere (i.e. once Hasta is retired).
        # Needed on: Singularity 3.1.1
        # No longer needed on: Apptainer 1.5.3
        # See: https://docs.docker.com/build/ci/github-actions/attestations/
        provenance: false